apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage-postgres
  namespace: backstage
  labels:
    app.kubernetes.io/name: backstage-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backstage-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backstage-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: backstage
            - name: POSTGRES_PASSWORD
              value: backstage123
            - name: POSTGRES_DB
              value: backstage_plugin_catalog
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backstage-postgres
  namespace: backstage
spec:
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app.kubernetes.io/name: backstage-postgres
