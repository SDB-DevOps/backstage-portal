app:
  title: SDB Developer Portal
  baseUrl: http://localhost:3000

organization:
  name: SDB Enterprise Platform Engineering

backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
  csp:
    connect-src: ["'self'", 'http:', 'https:']
  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  database:
    client: better-sqlite3
    connection: ':memory:'
  reading:
    allow:
      - host: '*'

integrations:
  github:
    - host: github.com
      token: ${GITHUB_TOKEN}

scaffolder:
  defaultAuthor:
    name: Backstage Robot
    email: backstage-bot@sdb-devops.internal
  defaultCommitMessage: 'feat(scaffolder): apply template via Backstage IDP'

catalog:
  import:
    entityFilename: catalog-info.yaml
  rules:
    - allow: [Component, System, API, Resource, Location, Template, Domain]
  locations:
    # In-repo catalog info
    - type: file
      target: ../../catalog-info.yaml
    # Cloud Storage Crossplane template
    - type: url
      target: https://github.com/SDB-DevOps/crossplane-infra/blob/main/templates/gcp-storage/template.yaml
      rules:
        - allow: [Template]
    - type: url
      target: https://github.com/SDB-DevOps/crossplane-infra/blob/main/templates/all-templates.yaml
      rules:
        - allow: [Location]

argocd:
  appLocatorMethods:
    - type: 'config'
      instances:
        - name: in-cluster
          url: https://argocd-server.argocd.svc.cluster.local
          token: ${ARGOCD_AUTH_TOKEN}

proxy:
  endpoints:
    '/argocd/api':
      target: http://argocd-server.argocd.svc.cluster.local:80/api/v1/
      changeOrigin: true
      secure: false
      headers:
        Authorization: Bearer ${ARGOCD_AUTH_TOKEN}
